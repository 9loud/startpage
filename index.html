<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~/startpage</title>
    <meta name="description" content="A Material 3 start page with bookmarks, search and a clock.">

    <meta name="theme-color" content="#19120b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fff8f4" media="(prefers-color-scheme: light)">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23fe8019'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23331a00' font-family='monospace'>~</text></svg>">

    <link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/sys.css">
    <link rel="stylesheet" href="css/app.css">

    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            try {
                var raw = JSON.parse(localStorage.getItem('startpage.data.v2') || 'null');
                var mode = raw && raw.settings && raw.settings.theme || 'dark';
                if (mode === 'system') {
                    mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                }
                document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
            } catch (error) {
                /* keep the default dark theme */
            }
        })();
    </script>
</head>

<body>
    <header class="app-bar">
        <a class="app-bar__brand" href="./" aria-label="startpage">
            <span class="app-bar__prompt" aria-hidden="true">~/</span><span class="app-bar__name">startpage</span>
        </a>

        <div class="app-bar__actions">
            <md-filled-tonal-icon-button class="ai-button" href="https://claude.ai/new" target="_blank"
                rel="noopener noreferrer" aria-label="Open Claude" title="Claude">
                <span class="ai-mark">C</span>
            </md-filled-tonal-icon-button>
            <md-filled-tonal-icon-button class="ai-button" href="https://gemini.google.com/app" target="_blank"
                rel="noopener noreferrer" aria-label="Open Gemini" title="Gemini">
                <span class="ai-mark">G</span>
            </md-filled-tonal-icon-button>
            <md-filled-tonal-icon-button class="ai-button" href="https://chatgpt.com" target="_blank"
                rel="noopener noreferrer" aria-label="Open ChatGPT" title="ChatGPT">
                <span class="ai-mark ai-mark--small">AI</span>
            </md-filled-tonal-icon-button>

            <span class="app-bar__divider" aria-hidden="true"></span>

            <md-icon-button id="theme-toggle" aria-label="Switch theme" title="Switch theme">
                <md-icon data-icon="light_mode"></md-icon>
            </md-icon-button>
            <md-icon-button id="settings-button" aria-label="Open settings" title="Settings">
                <md-icon data-icon="settings"></md-icon>
            </md-icon-button>
        </div>
    </header>

    <main class="layout">
        <figure class="hero-art">
            <div class="hero-art__frame">
                <img src="cat.gif" width="1000" height="1000"
                    alt="A person sitting at a desk, petting a cat in front of a computer." fetchpriority="high">
            </div>
            <figcaption class="hero-art__caption">~/cat.gif</figcaption>
        </figure>

        <section class="content" aria-label="Start page">
            <div class="clock">
                <div id="clock-time" class="clock__time" aria-live="off"></div>
                <div id="clock-date" class="clock__date"></div>
            </div>

            <form id="search-form" class="search" role="search" autocomplete="off">
                <div class="search-bar">
                    <span class="search-bar__icon" aria-hidden="true">
                        <md-icon data-icon="search"></md-icon>
                    </span>
                    <input id="search-input" class="search-bar__input" type="text" name="q"
                        placeholder="Search or enter address" aria-label="Search or enter address"
                        aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false"
                        spellcheck="false" autocapitalize="off" autocomplete="off">
                    <kbd class="search-bar__hint" aria-hidden="true">↵</kbd>
                </div>
                <div id="search-suggestions" class="suggestions" role="listbox" aria-label="Search suggestions"
                    hidden></div>
            </form>

            <div class="filters">
                <md-chip-set id="bookmark-filters" aria-label="Filter bookmarks"></md-chip-set>
            </div>

            <div id="bookmarks" class="bookmarks"></div>
        </section>
    </main>

    <md-fab id="add-link-fab" size="small" aria-label="Add a bookmark" title="Add a bookmark">
        <md-icon data-icon="add" slot="icon"></md-icon>
    </md-fab>

    <md-dialog id="settings-dialog" aria-label="Settings">
        <div slot="headline">Settings</div>
        <div slot="content" data-settings-content class="settings-content">
            <md-tabs id="settings-tabs" aria-label="Settings sections">
                <md-primary-tab active>Bookmarks</md-primary-tab>
                <md-primary-tab>Appearance</md-primary-tab>
                <md-primary-tab>Data</md-primary-tab>
            </md-tabs>
        </div>
        <div slot="actions">
            <md-text-button data-settings-cancel>Cancel</md-text-button>
            <md-filled-button data-settings-save>Save</md-filled-button>
        </div>
    </md-dialog>

    <md-dialog id="confirm-dialog" type="alert" aria-label="Confirmation">
        <div slot="headline" data-confirm-title>Are you sure?</div>
        <div slot="content" data-confirm-message class="md-body-medium"></div>
        <div slot="actions">
            <md-text-button data-confirm-cancel>Cancel</md-text-button>
            <md-filled-button data-confirm-ok>Delete</md-filled-button>
        </div>
    </md-dialog>

    <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

    <noscript>
        <p class="noscript">This start page uses JavaScript to load your bookmarks.</p>
    </noscript>

    <script src="vendor/material.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
